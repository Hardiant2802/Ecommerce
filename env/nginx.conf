upstream fastcgi_backend {
  server unix:/sock/docker.sock;
}

upstream react_frontend {
  server 172.17.0.1:3000;
}

server {
  listen 8000;
  return 301 https://$host$request_uri;
}

server {
  listen [::]:8443 ssl http2 ipv6only=on;
  listen 8443 ssl http2;

  ssl_certificate /etc/nginx/certs/nginx.crt;
  ssl_certificate_key /etc/nginx/certs/nginx.key;

  set $MAGE_ROOT /var/www/html;

  fastcgi_buffer_size 64k;
  fastcgi_buffers 8 128k;

  # Livereload for development
  location /livereload.js {
    proxy_set_header Host $host;
    proxy_pass http://phpfpm:35729/livereload.js;
  }

  location /livereload {
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";
    proxy_pass http://phpfpm:35729/livereload;
  }

  # Admin panel - Magento backend
  location /admin {
    include /var/www/html/nginx[.]conf;
  }

  # GraphQL API - Magento backend
  location /graphql {
    include /var/www/html/nginx[.]conf;
  }

  # REST API - Magento backend
  location /rest {
    include /var/www/html/nginx[.]conf;
  }

  # Static files from Magento (for admin)
  location /static {
    include /var/www/html/nginx[.]conf;
  }

  # Media files
  location /media {
    include /var/www/html/nginx[.]conf;
  }

  # Custom modules (Bai1, Bai2)
  location /bai1 {
    include /var/www/html/nginx[.]conf;
  }

  location /bai2 {
    include /var/www/html/nginx[.]conf;
  }

  # All other requests → React frontend
  location / {
    proxy_pass http://react_frontend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_cache_bypass $http_upgrade;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
